plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0.0"

// Release signing — see android/key.properties.sample and README
// "Android release configuration" for how to generate a real upload
// keystore. Both key.properties and the .jks/.keystore file it points to
// are gitignored; CI/local release builds must supply them out-of-band.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.thesignagesurgeon.technician"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        // Must match the Android app you register with `flutterfire configure`.
        applicationId = "com.thesignagesurgeon.technician"
        // Firebase Auth + flutter_reactive_ble both require API 23+.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled = true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Falls back to the debug key when no key.properties is present
            // (e.g. a fresh clone) so `flutter build apk --release` still
            // succeeds locally — swap in the `release` signingConfig above
            // once a real upload keystore exists. Never ship a Play Store
            // build signed with the debug key.
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            // No applicationIdSuffix: google-services.json only registers
            // one Android client (com.thesignagesurgeon.technician). A
            // ".debug" suffix here would change the debug build's real
            // package id to com.thesignagesurgeon.technician.debug, which
            // has no matching entry in that file and fails
            // :app:processDebugGoogleServices with "No matching client
            // found". Add a second Firebase Android app for the .debug id
            // if side-by-side debug+release installs are ever needed.
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:33.5.1")
    implementation "androidx.multidex:multidex:2.0.1"
}
