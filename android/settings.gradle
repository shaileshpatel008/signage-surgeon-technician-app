pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Paired with Gradle 8.14 (gradle-wrapper.properties). Flutter's build
    // dependency validation enforces a minimum AGP itself (this project has
    // hit that floor moving twice already as newer Flutter releases raised
    // it — 8.5.2 -> 8.9.1 -> 8.11.1); if a future Flutter upgrade demands
    // higher again, bump this to whatever version its error message names,
    // and stay below 9.0 until Gradle is also bumped to the 9.x line (AGP
    // 9+ requires the new DSL, which is a bigger migration, not a version
    // bump — see the "Flutter Fix" box in that error output).
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
}

include ":app"
